name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - yang_dev

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formato, compilación y pruebas JVM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ejecutar las pruebas de las Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Ejecutar validaciones locales
        run: >-
          ./gradlew
          spotlessCheck
          assembleDebug
          assembleRelease
          testDebugUnitTest
          lintDebug
          koverVerifyDebug
          assembleDebugAndroidTest

  firebase-emulators:
    name: Android 16 y Firebase Emulator Suite
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21 para Firebase Emulator Suite
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.34.0

      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preparar las Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Ejecutar pruebas instrumentadas
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # API 36 can fail to bind a color buffer even with SwiftShader on hosted runners.
          # Disable GPU surfaces entirely so instrumentation uses software rendering.
          gpu: off
          script: |
            trap 'rm -f .firebase-ci.json' EXIT
            node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("firebase.json", "utf8")); for (const name of ["auth", "firestore", "storage", "functions"]) { if (!config.emulators[name]) throw new Error(`Missing ${name} emulator config`); config.emulators[name].host = "0.0.0.0"; } fs.writeFileSync(".firebase-ci.json", JSON.stringify(config));'
            bash .github/scripts/run-instrumented-tests.sh

      - name: Comprobar que no se han omitido pruebas instrumentadas
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True))
          if not reports:
              print("No hay informes instrumentados; revisa el paso anterior.")
              sys.exit(0)

          total = 0
          skipped = []
          for path in reports:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  if case.find("skipped") is not None:
                      skipped.append(f"{case.get('classname')}.{case.get('name')}")

          print(f"Pruebas instrumentadas ejecutadas: {total}; omitidas: {len(skipped)}")
          for name in skipped:
              print(f"  OMITIDA: {name}")
          if skipped:
              sys.exit(
                  "Se han omitido pruebas instrumentadas. El Emulator Suite debe arrancar "
                  "auth, firestore, storage y functions para que no se salten por Assume."
              )
          PY

      - name: Conservar informes de pruebas instrumentadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
